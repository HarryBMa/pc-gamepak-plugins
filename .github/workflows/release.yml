name: Release

# One tag per plugin, so each is released on its own schedule:
#   playnite-v0.1   decky-v0.1.0   galaxy-v0.1.0   sync-v0.1.0
# The version in the tag must match the one the plugin declares, or the release
# is refused rather than published under a name that lies about its contents.

on:
  push:
    tags:
      - "playnite-v*"
      - "decky-v*"
      - "galaxy-v*"
      - "sync-v*"

permissions:
  contents: write

jobs:
  playnite:
    if: startsWith(github.ref_name, 'playnite-v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and pack
        shell: pwsh
        run: |
          $declared = (Select-String -Path playnite/extension.yaml -Pattern '^\s*Version\s*:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          if ("playnite-v$declared" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match extension.yaml Version $declared" }
          ./playnite/build.ps1 -Pack
          powershell -ExecutionPolicy Bypass -File playnite/test/test_reader.ps1
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem playnite/_build/*.pext).FullName --title "Playnite extension ${{ github.ref_name }}" --generate-notes

  python-plugins:
    if: startsWith(github.ref_name, 'galaxy-v') || startsWith(github.ref_name, 'sync-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test
        run: |
          python -m pip install -r gog-galaxy/requirements.txt
          python -m unittest discover -s common/tests
          python -m unittest discover -s sync/tests
          python -m unittest discover -s gog-galaxy/tests
      - name: Package
        id: package
        run: |
          case "$GITHUB_REF_NAME" in
            galaxy-v*) target=galaxy; declared=$(python -c "import json;print(json.load(open('gog-galaxy/manifest.json'))['version'])") ;;
            sync-v*)   target=sync;   declared=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('sync/pc_gamepak_sync/__init__.py').read()).group(1))") ;;
          esac
          [ "$GITHUB_REF_NAME" = "$target-v$declared" ] || { echo "tag $GITHUB_REF_NAME does not match declared version $declared"; exit 1; }
          echo "file=$(python tools/package.py $target)" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.file }}" --title "$GITHUB_REF_NAME" --generate-notes

  decky:
    if: startsWith(github.ref_name, 'decky-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and build
        working-directory: decky
        run: |
          declared=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF_NAME" = "decky-v$declared" ] || { echo "tag $GITHUB_REF_NAME does not match package.json version $declared"; exit 1; }
          python test/test_cartridges.py
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
      - name: Package
        id: package
        run: echo "file=$(python tools/package.py decky)" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.file }}" --title "$GITHUB_REF_NAME" --generate-notes
